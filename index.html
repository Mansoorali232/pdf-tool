<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Document Tools — Academic & Identity PDFs</title>
<style>
:root{color-scheme:light;--bg:#f5f7fb;--surface:#fff;--ink:#142238;--muted:#64748b;--line:#e3e9f2;--navy:#142d4e;--blue:#2864d7;--blue-soft:#edf4ff;--shadow:0 18px 55px rgba(20,42,72,.09)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
body{background:radial-gradient(ellipse at 50% -25%,#e5efff 0,transparent 48%),var(--bg)}
.top{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.9);backdrop-filter:blur(18px);border-bottom:1px solid rgba(220,229,241,.9);padding:17px clamp(16px,4vw,56px) 0}
.brand{max-width:1500px;margin:auto;display:flex;align-items:center;gap:14px;padding-bottom:15px}
.mark{width:46px;height:46px;border-radius:14px;background:linear-gradient(145deg,#193d68,#2864d7);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:850;letter-spacing:.04em;box-shadow:0 7px 18px rgba(40,100,215,.2)}
.heading{flex:1;min-width:190px}.heading strong{display:block;font-size:18px;letter-spacing:-.035em;font-weight:760}.heading span{display:block;margin-top:3px;font-size:12px;color:var(--muted);letter-spacing:.01em}
.status{font-size:11px;font-weight:650;color:#16734b;background:#eaf7f0;border:1px solid #d3eddf;border-radius:999px;padding:7px 11px;white-space:nowrap}
.tabs{max-width:1500px;margin:0 auto;display:flex;gap:7px;border-bottom:0}
.tab{appearance:none;position:relative;border:1px solid transparent;border-bottom:0;background:transparent;color:#63738a;border-radius:10px 10px 0 0;padding:12px 19px 14px;font:650 13px/1.2 inherit;cursor:pointer;transition:background .18s,color .18s,border-color .18s}
.tab:hover{background:#f4f7fc;color:var(--navy)}.tab[aria-selected="true"]{background:var(--blue-soft);color:#1f55ad;border-color:#dce8fb;box-shadow:inset 0 -3px 0 var(--blue)}
.main{padding:22px clamp(12px,3vw,40px) 36px}.workspace{max-width:1600px;margin:0 auto;background:var(--surface);border:1px solid #e1e8f1;border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.tool-frame{display:block;width:100%;height:calc(100vh - 150px);min-height:780px;border:0;background:#f5f7fb}.tool-frame[hidden]{display:none}
@media(max-width:640px){.top{padding:12px 12px 0}.brand{gap:10px;padding-bottom:12px}.mark{width:40px;height:40px;border-radius:12px}.heading strong{font-size:15px}.heading span{font-size:11px;max-width:230px}.status{font-size:10px;padding:6px 8px}.tabs{gap:3px}.tab{flex:1;padding:11px 7px 13px;font-size:11px}.main{padding:12px 0 20px}.workspace{border-left:0;border-right:0;border-radius:0}.tool-frame{height:calc(100vh - 135px);min-height:740px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
 <div class="brand">
  <div class="mark" aria-hidden="true">PDF</div>
  <div class="heading"><strong>Document Preparation Studio</strong><span>Prepare, organize and export your documents in one place</span></div>
  <div class="status">● Private · Runs locally</div>
 </div>
 <nav class="tabs" role="tablist" aria-label="Document tools">
  <button class="tab" id="tab-academic" role="tab" aria-selected="true" aria-controls="academic-frame">Academic documents</button>
  <button class="tab" id="tab-identity" role="tab" aria-selected="false" aria-controls="identity-frame">Identity documents</button>
 </nav>
</header>
<main class="main">
 <section class="workspace">
  <iframe class="tool-frame" id="academic-frame" title="Academic Documents to PDF" allow="downloads"></iframe>
  <iframe class="tool-frame" id="identity-frame" title="Identity Documents to PDF" allow="downloads" hidden></iframe>
 </section>
</main>

function decodeHTML(b64) {
 const raw=atob(b64), bytes=new Uint8Array(raw.length);
 for(let i=0;i<raw.length;i++) bytes[i]=raw.charCodeAt(i);
 return new TextDecoder().decode(bytes);
}
document.getElementById("academic-frame").srcdoc=decodeHTML(ACADEMIC_B64);
document.getElementById("identity-frame").srcdoc=decodeHTML(IDENTITY_B64);
const tabs=[...document.querySelectorAll('[role="tab"]')];
function activate(id) {
 const academic=id==="academic";
 document.getElementById("academic-frame").hidden=!academic;
 document.getElementById("identity-frame").hidden=academic;
 tabs.forEach(t=>t.setAttribute("aria-selected",String(t.id===(academic?"tab-academic":"tab-identity"))));
}
tabs.forEach(t=>t.addEventListener("click",()=>activate(t.id==="tab-academic"?"academic":"identity")));
tabs.forEach((t,i)=>t.addEventListener("keydown",e=>{if(e.key==="ArrowRight"||e.key==="ArrowLeft"){e.preventDefault();const n=tabs[(i+(e.key==="ArrowRight"?1:-1)+tabs.length)%tabs.length];n.focus();n.click();}}));
</script>
