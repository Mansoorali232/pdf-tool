<html lang="en">
<head>

<title>Document Preparation Studio</title>
<style>
:root{color-scheme:light;--ink:#15243a;--muted:#66758b;--line:#e3eaf3;--blue:#285fc2;--blue2:#3475df;--surface:#fff;--bg:#f3f6fb}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(ellipse at 50% -30%,#dce9ff 0,transparent 48%),var(--bg);color:var(--ink);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(18px);border-bottom:1px solid rgba(220,229,241,.95);padding:15px clamp(14px,4vw,54px) 0}
.brand{max-width:1480px;margin:auto;display:flex;align-items:center;gap:14px;padding-bottom:14px}
.mark{width:48px;height:48px;border-radius:15px;background:linear-gradient(145deg,#102846,#3475df);color:white;display:grid;place-items:center;font-size:13px;font-weight:850;letter-spacing:.06em;box-shadow:0 8px 20px rgba(40,95,194,.22)}
.heading{flex:1;min-width:0}.heading strong{display:block;font-size:18px;letter-spacing:-.035em;font-weight:780}.heading span{display:block;margin-top:3px;color:var(--muted);font-size:12px}
.status{display:inline-flex;align-items:center;gap:7px;color:#16734b;background:#edf8f1;border:1px solid #d4eddd;border-radius:999px;padding:7px 11px;font-size:11px;font-weight:700;white-space:nowrap}.dot{width:7px;height:7px;border-radius:50%;background:#22a568;box-shadow:0 0 0 3px rgba(34,165,104,.12)}
.tabs{max-width:1480px;margin:auto;display:flex;gap:7px}.tab{appearance:none;border:1px solid transparent;border-bottom:0;background:transparent;color:#64748b;border-radius:11px 11px 0 0;padding:12px 18px 14px;font:650 13px/1.2 inherit;cursor:pointer;transition:all .16s ease}.tab:hover{background:#f3f6fc;color:#17365e}.tab[aria-selected=true]{background:#edf3ff;color:#1d55ad;border-color:#dce7fb;box-shadow:inset 0 -3px 0 #3475df}.tab:focus-visible{outline:3px solid rgba(52,117,223,.3);outline-offset:2px}
.main{padding:20px clamp(10px,2.8vw,36px) 32px}.workspace{max-width:1600px;margin:auto;background:var(--surface);border:1px solid #e1e8f1;border-radius:17px;overflow:hidden;box-shadow:0 18px 55px rgba(20,42,72,.085)}.tool-frame{display:block;width:100%;height:1100px;border:0;background:#f3f5f9}.tool-frame[hidden]{display:none}
.footer{max-width:1600px;margin:12px auto 0;padding:0 4px;color:#8190a4;font-size:11px;display:flex;justify-content:space-between;gap:12px}
@media(max-width:640px){.top{padding:11px 10px 0}.brand{gap:10px;padding-bottom:11px}.mark{width:40px;height:40px;border-radius:12px}.heading strong{font-size:15px}.heading span{font-size:10px}.status{font-size:9px;padding:6px 8px}.tabs{gap:3px}.tab{flex:1;text-align:center;padding:11px 6px 13px;font-size:11px}.main{padding:12px 0 20px}.workspace{border-left:0;border-right:0;border-radius:0}.tool-frame{height:1200px}.footer{padding:0 12px;font-size:10px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>

 </nav>
</header>

function decodeDocument(encoded){const raw=atob(encoded),bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);return new TextDecoder().decode(bytes)}
const academicFrame=document.getElementById('academic-frame');
const identityFrame=document.getElementById('identity-frame');
academicFrame.srcdoc=decodeDocument(ACADEMIC_B64);
identityFrame.srcdoc=decodeDocument(IDENTITY_B64);
const tabs=[...document.querySelectorAll('[role="tab"]')];
function activate(which){const academic=which==='academic';academicFrame.hidden=!academic;identityFrame.hidden=academic;tabs.forEach(tab=>tab.setAttribute('aria-selected',String(tab.id===(academic?'tab-academic':'tab-identity'))));}
tabs.forEach((tab,index)=>{tab.addEventListener('click',()=>activate(tab.id==='tab-academic'?'academic':'identity'));tab.addEventListener('keydown',event=>{if(event.key==='ArrowRight'||event.key==='ArrowLeft'){event.preventDefault();const next=tabs[(index+(event.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length];next.focus();next.click()}})});
// Height messages are validated against the iframe windows; each tool remains a fully independent document.
addEventListener('message',event=>{if(!event.data||event.data.type!=='document-tool-height')return;let frame;if(event.source===academicFrame.contentWindow)frame=academicFrame;else if(event.source===identityFrame.contentWindow)frame=identityFrame;else return;const h=Number(event.data.height);if(Number.isFinite(h)&&h>300&&h<30000)frame.style.height=Math.ceil(h+24)+'px'});
</script>
